  <title id="ecosystem-title">Customer-centered Onchain Financial Ecosystem</title>
  <desc id="ecosystem-desc">A circular diagram with the customer at the center, surrounded by a ring of six layers - Identity, KYB, Encrypted Data, Reputation, Assets, and Liquidity - and an outer band of applications such as providers.</desc>
