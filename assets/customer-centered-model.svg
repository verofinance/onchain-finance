      .centerText { fill: #ffffff; font-size: 25px; font-weight: 700; }
      .centerSmall { fill: #cfe4d6; font-size: 12.5px; }
    </style>
    <path id="lp0" d="M 91.37 188 A 264 264 0 0 1 548.63 188"/>
